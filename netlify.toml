# Netlify configuration
#
# Deploys:
#   - Static SPA (built with Vite → dist/)
#   - Netlify Functions for the backend API
#
# Three functions are defined:
#   - /api/auth/*         → netlify/functions/auth/auth.ts
#   - /api/sessions, /profile, /favorites → netlify/functions/data/data.ts
#   - /api/stripe/*, /subscriptions/*    → netlify/functions/stripe/stripe.ts

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "20"
    NPM_FLAGS = "--legacy-peer-deps"

# ─── API redirects → Netlify Functions ─────────────────────────────
# Each function re-exports the same base handler; the router in
# _common.ts decides which route to serve based on event.path.

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/sessions"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/sessions/*"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/profile/*"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/favorites"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/favorites/*"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscriptions"
  to = "/.netlify/functions/stripe"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscriptions/*"
  to = "/.netlify/functions/stripe"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/*"
  to = "/.netlify/functions/stripe"
  status = 200
  force = true

# ─── SPA fallback ───────────────────────────────────────────────────
# Catch-all: any non-API, non-static route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ─── Cache static assets (hashed filenames) ─────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# ─── Security headers ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
