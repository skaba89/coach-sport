# Render Blueprint (render.com)
#
# Deploys two services:
#   1. web   — the static frontend (Vite SPA)
#   2. api   — the backend (Node server exposing /api/* via Express)
#
# The api service is required because Render doesn't have built-in
# serverless functions like Netlify/Vercel — it runs a long-lived process.
#
# Both services auto-deploy on push to main.

services:
  - type: web
    name: coach-sport-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false  # disable to save free-tier minutes
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
    routes:
      # SPA fallback: serve index.html for any path
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Cache static assets aggressively
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: coach-sport-api
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run serve:api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard (Neon Postgres URL)
      - key: JWT_SECRET
        sync: false  # set manually (openssl rand -hex 32)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: CORS_ORIGIN
        value: https://coach-sport-web.onrender.com  # update with your web URL
